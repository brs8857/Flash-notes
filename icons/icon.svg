<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8BFF"/><stop offset="0.55" stop-color="#4C6EF5"/><stop offset="1" stop-color="#3A2FC2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1EEE8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE066"/><stop offset="1" stop-color="#FAB005"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1460" flood-opacity="0.35"/></filter>
  </defs>
  <!-- full-bleed background (iOS applies its own squircle mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="860" cy="150" r="300" fill="#fff" opacity="0.07"/>
  <!-- page (squircle-ish) -->
  <g filter="url(#sh)" transform="rotate(-6 512 540)">
    <path d="M300 220 C300 196 316 180 340 180 L684 180 C708 180 724 196 724 220 L724 840 C724 864 708 880 684 880 L340 880 C316 880 300 864 300 840 Z" fill="url(#paper)"/>
    <g stroke="#9DB2F5" stroke-width="10" opacity="0.55" stroke-linecap="round">
      <line x1="360" y1="330" x2="664" y2="330"/><line x1="360" y1="420" x2="664" y2="420"/>
      <line x1="360" y1="510" x2="664" y2="510"/><line x1="360" y1="600" x2="664" y2="600"/>
      <line x1="360" y1="690" x2="664" y2="690"/><line x1="360" y1="780" x2="560" y2="780"/>
    </g>
  </g>
  <!-- lightning bolt -->
  <path d="M590 250 L410 560 L520 560 L452 800 L660 470 L548 470 L612 250 Z" fill="url(#bolt)" stroke="#C77700" stroke-width="10" stroke-linejoin="round" filter="url(#sh)"/>
</svg>
