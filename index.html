<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flash Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Free, unlimited, offline handwriting notes for students. Works with Apple Pencil.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flash Notes">
<!-- "default" keeps the clock readable over the light top bar ("black-translucent" always draws white text). -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script>
  // Apply a forced theme before first paint (the full settings live in IndexedDB).
  try { var t = localStorage.getItem('fln.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/canvas.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:40px;text-align:center">Flash Notes needs JavaScript to run.</p></noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
